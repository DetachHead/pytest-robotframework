[project]
name = "pytest_robotframework"
version = "4.6.3"
description = "a pytest plugin that can run both python and robotframework tests while generating robot reports for them"
authors = [
  { name = "DetachHead", email = "detachhead@users.noreply.github.com" },
]
# remember to update the version range mentioned in compatibility.md
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "ansi2html>=1.9.1",
  "pluggy", # transitive dependency of pytest that we explicitly depend on
  # we use uppper bounds deliberately here because we rely a lot on pytest and robotframework internals. a major version update
  # will almost certainly cause pytest-robotframework to break.
  # when updating these version ranges, remember to update the versions in compatibility.md
  "pytest>=7,<10",
  "robotframework>=6.1,<8.0.0",
]
[dependency-groups]
dev = [
  "basedpyright>=1.10.1",
  "pylint>=3.2.0",
  "ruff>=0.2.0",
  "robotframework-robocop>=6",
  "lxml>=4.9.3",
  "pytest-xdist>=3.5.0",
  "pytest-github-actions-annotate-failures>=0.2.0",
  "robotcode[analyze]>=0.97.0",
  "dprint-py>=0.49.1.2",
  "ty>=0.0.0a8",
  "exceptiongroup>=1.3.0",
  "mkdocs-material>=9.6.17",
  "mkdocs-unused-files>=0.2.0",
  "mkdocs-awesome-pages-plugin>=2.10.1",
  "mkdocstrings-python>=1.17.0",
  "mike>=2.1.3",
  "tach>=0.32.2",
  "griffe-public-redundant-aliases>=0.3.0",
  "types-lxml>=2026.2.16",
]

[project.urls]
repository = "https://github.com/detachhead/pytest-robotframework"

[project.entry-points.pytest11]
robotframework = "pytest_robotframework._internal.pytest.plugin"

[tool.pyprojectx.aliases]
# when adding an alias here, a vscode task should probably also be added too
# unless there's already a task or something in vscode that does the same thing
update = "uv lock --upgrade"
test = "uv run pytest -n auto"
basedpyright = [
  "uv run basedpyright",
  "uv run basedpyright --verifytypes pytest_robotframework --ignoreexternal",
]
ty = 'uv run ty check'
ruff_check = ['uv run ruff check', 'uv run ruff format --check --diff']
ruff_fix = ['uv run ruff check --fix', 'uv run ruff format']
pylint = 'uv run pylint pytest_robotframework tests'
robocop_lint = 'uv run robocop check'
robocop_format = 'uv run robocop format --check .'
robotcode = 'uv run robotcode analyze code'
dprint = 'uv run dprint check'
tach = ['uv run tach check', 'uv run tach check-external']
open_docs = 'uv run mkdocs serve'
clear_pycache = 'python scripts/clear_pycache.py'

[tool.uv.build-backend]
module-root = "."

[tool.uv]
prerelease-package = { pytest = "allow", robotframework = "allow" }

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.pylint.MASTER]
fail-on = "I"
bad-names = ["foo", "bar", "baz", "retval"]
load-plugins = [
  # we don't use all of these but enabling them all for completeness since there's no error if a rule is not found
  "pylint.extensions.bad_builtin",
  "pylint.extensions.broad_try_caluse",
  "pylint.extensions.check_elif",
  "pylint.extensions.code_style",
  "pylint.extensions.comparetozero",
  "pylint.extensions.comparison_placement",
  "pylint.extensions.confusing_elif",
  "pylint.extensions.consider_refactoring_into_while_condition",
  "pylint.extensions.consider_ternary_expression",
  "pylint.extensions.dict_init_mutate",
  "pylint.extensions.docparams",
  "pylint.extensions.docstyle",
  "pylint.extensions.dunder",
  "pylint.extensions.empty_comment",
  "pylint.extensions.emptystring",
  "pylint.extensions.eq_without_hash",
  "pylint.extensions.for_any_all",
  "pylint.extensions.magic_value",
  "pylint.extensions.no_self_use",
  "pylint.extensions.overlapping_exceptions",
  "pylint.extensions.private_import",
  "pylint.extensions.redefined_loop_name",
  "pylint.extensions.redefined_variable_type",
  "pylint.extensions.set_membership",
  "pylint.extensions.typing",
  "pylint.extensions.while_used",
]

[tool.pylint."MESSAGE CONTROL"]
disable = ["R", "C", "E", "F", "W", "I"]
enable = [
  "useless-suppression",
  # rules that have not yet been implemented in ruff. once all of these are implemented in ruff, we should remove pylint
  # (see https://github.com/astral-sh/ruff/issues/970):
  "access-member-before-definition",
  "assignment-from-none",
  "dict-iter-missing-items",
  "invalid-bool-returned",
  "invalid-getnewargs-ex-returned",
  "invalid-getnewargs-returned",
  "invalid-index-returned",
  "invalid-length-hint-returned",
  "invalid-slice-index",
  "invalid-slice-step",
  "invalid-slots",
  "invalid-slots-object",
  "invalid-unicode-codec",
  "logging-format-truncated",
  "logging-unsupported-format",
  "method-hidden",
  "modified-iterating-dict",
  "potential-index-error",
  "relative-beyond-top-level",
  "abstract-method",
  "arguments-out-of-order",
  "attribute-defined-outside-init",
  "confusing-with-statement",
  "deprecated-decorator",
  "deprecated-module",
  "differing-param-doc",
  "global-variable-undefined",
  "missing-param-doc",
  "modified-iterating-list",
  "multiple-constructor-doc",
  "non-parent-init-called",
  "overlapping-except",
  "preferred-module",
  "raising-format-tuple",
  "redefined-outer-name",
  "redefined-slots-in-subclass",
  "redundant-returns-doc",
  "redundant-yields-doc",
  "shallow-copy-environ",
  "useless-param-doc",
  "useless-parent-delegation",
  "useless-type-doc",
  "using-constant-test",
  "bad-file-encoding",
  "dict-init-mutate",
  "use-implicit-booleaness-not-comparison",
  "chained-comparison",
  "confusing-consecutive-elif",
  "consider-using-join",
  "consider-using-max-builtin",
  "consider-using-min-builtin",
  "consider-using-namedtuple-or-dataclass",
  "consider-using-tuple",
  "simplifiable-condition",
  "simplify-boolean-expression",
  "contextmanager-generator-missing-cleanup",
]

[tool.pylint.REPORTS]
reports = "no"
output-format = "colorized"
score = "no"

[tool.pylint.FORMAT]
max-line-length = 200

[tool.pytest.ini_options]
addopts = ['-p', 'no:robotframework', '--ignore=tests/fixtures', '-vv']
xfail_strict = true
enable_assertion_pass_hook = true

[tool.basedpyright]
ignore = ["pw"]
pythonVersion = "3.10"
allowedUntypedLibraries = [
  'robot', # https://github.com/robotframework/robotframework/issues/4822
]
reportImplicitStringConcatenation = false # handled by ruff
reportUnusedImport = false # covered by ruff (has quickfix)
reportUnusedVariable = false # covered by ruff (has quickfix)
deprecateTypingAliases = false # covered by ruff (has quickfix)
# even though we enable this rule we still keep reportUnannotatedClassAttribute enabled since this is a library
reportIncompatibleUnannotatedOverride = 'error'

[tool.ty.src]
exclude = ["pw"]

[tool.ty.rules]
# https://github.com/astral-sh/ty/issues/174
division-by-zero = "error"
possibly-unresolved-reference = "warn"
unused-ignore-comment = "warn"
possibly-missing-import = "error"

[tool.ty.environment]
python-platform = "all"

[tool.ty.terminal]
error-on-warning = true

[tool.ruff]
unsafe-fixes = true
target-version = "py310"
respect-gitignore = true
line-length = 100
preview = true
extend-exclude = ["pw"]

[tool.ruff.lint]
extend-select = ["ALL"]
ignore = [
  "ANN", # flake8-annotations (covered by pyright)
  "EM", # flake8-errmsg
  "FIX", # flake8-fixme
  "too-many-arguments",
  "too-many-branches",
  "too-many-statements",
  "too-many-nested-blocks",
  "magic-value-comparison",
  "sys-exit-alias",
  "redefined-loop-name",
  "invalid-all-format", # covered by pyright
  "too-many-return-statements",
  "global-statement",
  "type-name-incorrect-variance",
  "useless-import-alias", # used by pyright for explicit re-export
  "implicit-optional", # covered by pyright
  "invalid-index-type", # covered by pyright
  "raise-vanilla-class",
  "raise-vanilla-args",
  "D10", # Missing docstring
  "incorrect-blank-line-before-class",
  "missing-blank-line-after-summary",
  "multi-line-summary-first-line",
  "missing-trailing-period",
  "non-imperative-mood",
  "first-word-uncapitalized",
  "docstring-starts-with-this",
  "non-capitalized-section-name",
  "missing-new-line-after-section-name",
  "missing-terminal-punctuation",
  "overload-with-docstring", # vscode supports it
  "missing-blank-line-after-last-section",
  "pytest-incorrect-pytest-import", # only for bad linters that can't check the qualname
  "missing-todo-author",
  "missing-copyright-notice",
  "complex-structure",
  "private-member-access", # covered by pyright
  "import-private-name", # covered by pyright
  "single-line-implicit-string-concatenation", # conflicts with formatter
  "missing-trailing-comma", # conflicts with formatter
  "invalid-envvar-value", # covered by pyright
  "unnecessary-multiline-docstring", # https://github.com/astral-sh/ruff/issues/6269
  "docstring-missing-returns",
  "docstring-missing-exception", # https://github.com/astral-sh/ruff/issues/12520
  "unused-function-argument", # covered by basedpyright
  "runtime-cast-value", # quoted types look disgusting
  "trailing-whitespace", # covered by formatter + false positives inside multiline strings
  "blank-line-with-whitespace", # covered by formatter + false positives inside multiline strings
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.per-file-ignores]
"*.pyi" = [
  # we don't control names in 3rd party modules
  "builtin-variable-shadowing",
  "builtin-argument-shadowing",
  "N",
]
"tests/**/*.py" = [
  "assert", # pytest uses assert statements
]
[tool.ruff.lint.isort]
combine-as-imports = true
required-imports = ["from __future__ import annotations"]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true
docstring-code-format = true
[tool.robocop.format]
configure = [
  "AlignTemplatedTestCases.enabled=True",
  "RenameKeywords.enabled=True",
  "RenameTestCases.enabled=True",
  "SplitTooLongLine.line_length=160",
]

[tool.robocop]
include = [
  "tests",
]

[tool.robocop.lint]
ignore = [
  "not-allowed-char-in-filename",
  "non-local-variables-should-be-uppercase",
  "section-variable-not-uppercase",
  "too-many-calls-in-test-case",
  "too-many-calls-in-keyword",
  "too-long-test-case",
  "too-many-arguments",
  "not-capitalized-test-case-title",
  "file-too-long",
  "too-long-keyword",
  "missing-doc-resource-file",
  "missing-doc-keyword",
  "missing-doc-suite",
  "missing-doc-test-case",
  "todo-in-comment",
  "too-many-test-cases",
]
reports = [
  "all",
]
configure = [
  "too-many-calls-in-keyword.severity=W",
  "can-be-resource-file.severity=W",
  "missing-doc-suite.severity=W",
  "line-too-long.line_length=160",
  "possible-variable-overwriting.severity=E",
  "could-be-test-tags.severity=E",
  "tag-already-set-in-test-tags.severity=E",
  "unused-variable.severity=W",
  "unnecessary-string-conversion.severity=W",
  "expression-can-be-simplified.severity=W",
  "can-be-resource-file.severity=W",
]

[tool.robotcode-analyze.modifiers]
error = [
  "LibraryAlreadyImported",
  "ResourceAlreadyImported",
  "VariablesAlreadyImported",
]

[tool.tach]
interfaces = []
exclude = [
  "**/*__pycache__",
  "**/*egg-info",
  "**/docs",
  "**/tests",
  "**/.venv",
]
source_roots = [
  ".",
]
ignore_type_checking_imports = false

[[tool.tach.modules]]
path = "scripts"
depends_on = []

[[tool.tach.modules]]
path = "pytest_robotframework"
depends_on = ["pytest_robotframework._internal.*"]

[[tool.tach.modules]]
path = "pytest_robotframework._internal.robot"
cannot_depend_on = ["pytest_robotframework._internal.pytest"]

[tool.tach.rules]
unused_ignore_directives = "error"
unused_external_dependencies = "error"
